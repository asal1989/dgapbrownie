<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantra Box</title>
<style>
  :root { --bg:#2b1810; --card:#3d2317; --accent:#e8b27a; --text:#fff3e6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); font-family:Georgia, serif; color:var(--text); }
  .mantra-box { width:min(92vw, 520px); padding:32px 28px 20px; background:var(--card); border:1px solid var(--accent); border-radius:16px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .label { font-size:.75rem; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin-bottom:16px; }
  .mantra { min-height:120px; display:flex; flex-direction:column; justify-content:center; gap:8px; transition:opacity .5s ease, transform .5s ease; }
  .mantra.fade { opacity:0; transform:translateY(8px); }
  .mantra .text { font-size:1.6rem; line-height:1.3; }
  .mantra .meaning { font-size:.95rem; font-style:italic; opacity:.75; }
  .controls { display:flex; justify-content:center; align-items:center; gap:12px; margin-top:20px; }
  button { background:transparent; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:6px 14px; font-size:.9rem; cursor:pointer; }
  button:hover, button:focus-visible { background:var(--accent); color:var(--bg); }
  .dots { display:flex; justify-content:center; gap:6px; margin-top:16px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); opacity:.3; cursor:pointer; }
  .dot.active { opacity:1; }
  .progress { height:2px; background:rgba(232,178,122,.2); margin-top:16px; border-radius:2px; overflow:hidden; }
  .progress > i { display:block; height:100%; width:0; background:var(--accent); }
  @media (prefers-reduced-motion: reduce) { .mantra { transition:none; } }
</style>
</head>
<body>
<section class="mantra-box" aria-live="polite">
  <div class="label">Today's Mantra</div>
  <div class="mantra" id="mantra">
    <div class="text" id="text"></div>
    <div class="meaning" id="meaning"></div>
  </div>
  <div class="progress"><i id="bar"></i></div>
  <div class="controls">
    <button id="prev" aria-label="Previous mantra">&larr;</button>
    <button id="toggle" aria-label="Pause or play">Pause</button>
    <button id="next" aria-label="Next mantra">&rarr;</button>
  </div>
  <div class="dots" id="dots"></div>
</section>

<script>
  // Edit this list - later it can come from the server/admin panel.
  const MANTRAS = [
    { text: "Om Namah Shivaya",      meaning: "I bow to the inner self" },
    { text: "Om Shanti Shanti Shanti", meaning: "Peace in body, mind and spirit" },
    { text: "So Hum",                meaning: "I am that" },
    { text: "Lokah Samastah Sukhino Bhavantu", meaning: "May all beings be happy" },
    { text: "Om Mani Padme Hum",     meaning: "The jewel is in the lotus" }
  ];
  const INTERVAL = 6000; // ms between changes

  const $ = id => document.getElementById(id);
  const box = $("mantra"), textEl = $("text"), meaningEl = $("meaning"), bar = $("bar"), dotsEl = $("dots"), toggle = $("toggle");
  let index = 0, playing = true, timer = null, start = 0, raf = null;

  MANTRAS.forEach((_, i) => {
    const d = document.createElement("span");
    d.className = "dot"; d.onclick = () => show(i);
    dotsEl.appendChild(d);
  });

  function show(i) {
    index = (i + MANTRAS.length) % MANTRAS.length;
    box.classList.add("fade");
    setTimeout(() => {
      textEl.textContent = MANTRAS[index].text;
      meaningEl.textContent = MANTRAS[index].meaning;
      box.classList.remove("fade");
    }, 400);
    [...dotsEl.children].forEach((d, k) => d.classList.toggle("active", k === index));
    restart();
  }

  function tick(now) {
    bar.style.width = Math.min(100, ((now - start) / INTERVAL) * 100) + "%";
    if (playing) raf = requestAnimationFrame(tick);
  }
  function restart() {
    clearTimeout(timer); cancelAnimationFrame(raf);
    start = performance.now(); bar.style.width = "0";
    if (playing) { timer = setTimeout(() => show(index + 1), INTERVAL); raf = requestAnimationFrame(tick); }
  }

  $("next").onclick = () => show(index + 1);
  $("prev").onclick = () => show(index - 1);
  toggle.onclick = () => { playing = !playing; toggle.textContent = playing ? "Pause" : "Play"; restart(); };

  textEl.textContent = MANTRAS[0].text; meaningEl.textContent = MANTRAS[0].meaning;
  dotsEl.children[0].classList.add("active");
  restart();
</script>
</body>
</html>
